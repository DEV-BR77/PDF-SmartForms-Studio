name: Fehler
description: Reproduzierbaren Fehler melden
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes: {label: Version/Build}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Schritte zur Reproduktion}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Erwartetes Verhalten}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Tatsächliches Verhalten}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine echten Profile, Unterschriften oder vertraulichen PDFs angehängt.
          required: true

